name: Server CI

on:
  pull_request:
    paths:
      - '.github/workflows/server-ci.yml'
      - 'packages/server/**'
      - 'packages/protocol/**'
      - 'packages/admin-ui/**'
      - 'vendor/mentionable-connector-kit/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/server-ci.yml'
      - 'packages/server/**'
      - 'packages/protocol/**'
      - 'packages/admin-ui/**'
      - 'vendor/mentionable-connector-kit/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vicoop_bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build protocol
        run: pnpm --filter @vicoop-bridge/protocol build

      - name: Build Mentionable connector kit
        run: pnpm --filter @mentionable/connector-kit build

      - name: Typecheck server
        run: pnpm --filter @vicoop-bridge/server typecheck

      - name: Test server
        run: pnpm --filter @vicoop-bridge/server test

      - name: Test task access with PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/vicoop_bridge_test
        run: pnpm --filter @vicoop-bridge/server exec tsx --test src/task-access.test.ts src/admin-task-access.test.ts

      - name: Build server
        run: pnpm --filter @vicoop-bridge/server build

      - name: Smoke test A2X SDK import
        working-directory: packages/server
        run: node --input-type=module -e "await import('@a2x/sdk'); console.log('a2x-sdk-import-ok')"
