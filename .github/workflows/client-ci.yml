name: Client CI

on:
  pull_request:
    paths:
      - '.github/workflows/client-ci.yml'
      - '.github/workflows/release.yml'
      - 'packages/client/**'
      - 'container/backends/claude.sh'
      - 'packages/protocol/**'
      - 'scripts/**'
      - 'install.sh'
      - 'pnpm-lock.yaml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-ci.yml'
      - '.github/workflows/release.yml'
      - 'packages/client/**'
      - 'container/backends/claude.sh'
      - 'packages/protocol/**'
      - 'scripts/**'
      - 'install.sh'
      - 'pnpm-lock.yaml'
      - 'package.json'
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Mirrors the version pinned in release.yml so the cross-compile
      # dry-run below exercises the exact same toolchain that publishes
      # release assets.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build protocol
        run: pnpm --filter @vicoop-bridge/protocol build

      - name: Typecheck client
        run: pnpm --filter @vicoop-bridge/client typecheck

      - name: Test client
        run: pnpm --filter @vicoop-bridge/client test

      - name: Verify embedded caller image recipe is current
        run: |
          node packages/client/scripts/generate-caller-image.mjs
          node packages/client/scripts/generate-storage-image.mjs
          git diff --exit-code -- packages/client/src/caller-image-assets.ts packages/client/src/caller-storage-assets.ts

      - name: Test Bun caller storage and standalone SQLite
        run: |
          bun test packages/client/src/caller-runtime-store.test.ts packages/client/src/caller-container-init.test.ts packages/client/src/caller-storage-manager.test.ts
          bun build --compile packages/client/scripts/caller-store-smoke.ts --outfile /tmp/caller-store-smoke
          /tmp/caller-store-smoke

      - name: Build client
        run: pnpm --filter @vicoop-bridge/client build

      # Cross-compile dry-run: produces every per-platform release binary
      # (macOS arm64/x64, Linux arm64/x64, Windows x64) plus its .sha256
      # sidecar into dist-release/, without uploading anything. Catches
      # regressions in scripts/package-client-release.sh, the bun
      # cross-compile matrix, and any code path that breaks under
      # `bun build --compile` (e.g. unembeddable native modules) before
      # the release workflow has to discover it on `main`. Whichever tag
      # we feed only affects the asset filename — the build artefacts
      # themselves are version-agnostic for this check.
      - name: Cross-compile release binaries (dry-run)
        run: |
          CLIENT_VERSION="$(node -p "require('./packages/client/package.json').version")"
          ./scripts/package-client-release.sh "@vicoop-bridge/client@${CLIENT_VERSION}"

      - name: Sanity-check Linux x64 binary
        run: |
          CLIENT_VERSION="$(node -p "require('./packages/client/package.json').version")"
          BIN="dist-release/vicoop-client-${CLIENT_VERSION}-linux-x64"
          GOT="$("$BIN" --version)"
          if [[ "$GOT" != "$CLIENT_VERSION" ]]; then
            echo "::error::compiled binary reported '$GOT', expected '$CLIENT_VERSION'"
            exit 1
          fi
          echo "linux-x64 binary --version: $GOT"
          VICOOP_CLIENT_BIN="$(realpath "$BIN")" node packages/client/scripts/storage-init-packaging-smoke.mjs

      - name: Upload macOS ARM64 binary for native validation
        uses: actions/upload-artifact@v4
        with:
          name: client-macos-arm64
          path: dist-release/*-macos-arm64*
          if-no-files-found: error
          retention-days: 1

  storage-init:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vicoop-bridge/protocol build
      - name: Real Docker storage initialization and retained caller data
        env:
          VICOOP_FIXED_STORAGE_TEST: '1'
        run: pnpm --filter @vicoop-bridge/client exec tsx --test src/caller-storage-init.integration.test.ts

  validate-macos-arm64:
    needs: validate
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Test the Linux-built bytes without rebuilding or re-signing them.
      - name: Download cross-compiled macOS ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: client-macos-arm64
          path: dist-release

      - name: Verify checksum, signature, and CLI startup
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          CLIENT_VERSION="$(node -p "require('./packages/client/package.json').version")"
          cd dist-release
          BIN="vicoop-client-${CLIENT_VERSION}-macos-arm64"
          shasum -a 256 -c "$BIN.sha256"
          chmod +x "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          GOT="$("./$BIN" --version)"
          if [[ "$GOT" != "$CLIENT_VERSION" ]]; then
            echo "::error::compiled binary reported '$GOT', expected '$CLIENT_VERSION'"
            exit 1
          fi
          "./$BIN" --help
