name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/protocol/**'
      - 'packages/admin-ui/**'
      - 'pnpm-lock.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fly deploy
        run: flyctl deploy --remote-only --config packages/server/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test deployed health endpoint
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 3 https://vicoop-bridge-server.fly.dev/healthz

      - name: Verify approved production publication identity and key
        # The signing-enabled operations daemon prepares its key on reconnect.
        # These values pin its existing Slack approval and retired shared key.
        shell: bash
        run: |
          for attempt in {1..12}; do
            if node examples/outbound/check-publication.mjs \
              --address acct:vicoop-ops-agent@vicoop-bridge-server.fly.dev \
              --subject https://vicoop-bridge-server.fly.dev/publication-identities/vicoop-ops-agent/L1mMPDEgf9aD8q6m72WnHqo2m7axDFwMly04c3C4kn0 \
              --deny-kid SV3hkVNtDVyz0EZzpYcVMk6TlzukREgCsbpogfcS6RA; then
              exit 0
            fi
            if (( attempt < 12 )); then sleep 5; fi
          done
          exit 1
