name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # Required for pushing the container image to ghcr.io (see the
  # `Build and push container image` step below).
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Needed so `changeset tag` sees already-released tags as
          # existing — otherwise it would re-tag HEAD with a name that
          # already points at a different commit on the remote, and the
          # subsequent `git push` would fail.
          fetch-tags: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Bun cross-compiles the per-platform vicoop-client binaries from a
      # single Linux runner via `bun build --compile --target=…`. The
      # asset-upload step (scripts/package-client-release.sh) invokes it;
      # changesets/action above only needs Node.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # When pending changesets exist, this opens / refreshes the
      # "Version Packages" PR. When that PR merges (no pending changesets
      # remain), the publish step runs `pnpm changeset tag` which creates
      # the local `@vicoop-bridge/client@<version>` tag; the action then
      # pushes that tag and creates the GitHub release object using the
      # CHANGELOG entry as the body. Asset files are attached in the
      # following step.
      - name: Version PR or tag client release
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset tag
          commit: 'chore: version packages'
          title: 'chore: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The script is idempotent: it reads the current client version
      # from package.json, looks up the matching release, and exits
      # cheaply when assets are already complete or the release doesn't
      # exist yet. Running unconditionally lets a workflow_dispatch
      # rerun recover from a failure between release creation and asset
      # upload, where `changeset tag` on rerun would otherwise produce
      # no `published` signal.
      - name: Upload client release assets
        run: ./scripts/upload-client-release-assets.sh

      # ----------------------------------------------------------------
      # Container image publish (ghcr.io/planetarium/vicoop-bridge-client)
      # ----------------------------------------------------------------
      # Only runs when `changesets/action` actually cut a new release on
      # this commit. workflow_dispatch reruns for native-asset recovery
      # don't re-publish the image — operators wanting to rebuild the
      # image after a recovery should rerun the full Version-PR merge
      # cycle or push manually.
      - name: Read client version
        if: steps.changesets.outputs.published == 'true'
        id: client-version
        run: |
          VERSION=$(jq -r .version packages/client/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.changesets.outputs.published == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changesets.outputs.published == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.changesets.outputs.published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        if: steps.changesets.outputs.published == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          # linux/amd64 only for v1 — arm64 follow-up issue. Multi-arch
          # via buildx is straightforward to add once #244's PR 1 lands.
          platforms: linux/amd64
          push: true
          build-args: |
            VICOOP_BRIDGE_IMAGE=${{ steps.client-version.outputs.version }}
          tags: |
            ghcr.io/planetarium/vicoop-bridge-client:${{ steps.client-version.outputs.version }}
            ghcr.io/planetarium/vicoop-bridge-client:latest
          # Layer cache between runs via the GitHub Actions cache.
          # Without this every release rebuilds from scratch (~3 min).
          cache-from: type=gha
          cache-to: type=gha,mode=max
