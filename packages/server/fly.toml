app = "vicoop-bridge-server"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VITE_WALLETCONNECT_PROJECT_ID = "e2ead043530cfc0d06ef42a09b97ebe2"

[env]
  PORT = "8787"
  POSTGRAPHILE_PORT = "5433"
  # Sentry → dedicated "vicoop-bridge-server" project (spans + logs both land
  # there). Enables the SDK in this deployment; the DSN comes from the
  # SENTRY_DSN Fly secret (see packages/server/src/instrument.ts).
  SENTRY_ENABLED = "true"
  SENTRY_ENVIRONMENT = "production"
  # Time-based retention for infra.a2a_tasks (see #385 and
  # PostgresTaskStore.pruneStaleContexts). Contexts idle longer than this are
  # reclaimed by the hourly cleanup job; "0" disables it. Complements the
  # count-based per-context cap in upsert().
  A2A_TASK_RETENTION_DAYS = "30"
  # Forensics switch for the inbound request envelope (see #419 / #408 / #409).
  # Unset/false (the default) strips the full `chat_completions_request` from
  # every persisted task row — the lean post-#409 behavior. Set to "1"/"true" to
  # retain it, making each stored task a complete, replayable record of its input
  # (inspect via getTask / SQL: `task_json`). This re-introduces the #408
  # near-quadratic growth for as long as it is on, so it is an ON-DEMAND
  # debugging toggle to enable for a window and turn back off — NOT a steady
  # state. Left off here on purpose; flip it with `fly secrets set` / a deploy
  # when investigating, then revert (and VACUUM FULL to reclaim the disk).
  # A2A_PERSIST_REQUEST_ENVELOPE = "1"
  # Server-authoritative inactivity backstop (ms) for an in-flight task's SSE
  # stream: if the connected daemon sends NO frame — content, artifact, or
  # heartbeat task.status — for this long, the bridge fabricates a terminal
  # `failed` status so the stream closes instead of hanging on a lost/absent
  # terminal frame (see WSForwardingExecutor). Any inbound frame resets it, so a
  # healthily-heartbeating long task is never reaped. "0" disables it. Must sit
  # above the longest legitimate silent gap for non-heartbeating backends.
  BRIDGE_TASK_INACTIVITY_TIMEOUT_MS = "600000"
  # Reconnect grace hold (ms) for an in-flight task whose replay-capable
  # client's WebSocket drops (issue #474). Rather than failing the task the
  # instant the socket goes, the bridge keeps its binding alive so the client
  # can replay unacknowledged output. A generation-correct, gap-free frame on
  # the authenticated replacement connection resumes the task. Legacy clients
  # still fail immediately.
  #
  # Sized off the 2026-08-20 fly-proxy incident, where the recovered clients'
  # terminal frames arrived +9s/+10s/+15s after the drop — so it has to cover
  # task completion, not the 3.2s reconnect.
  #
  # "0" disables it and restores the previous fail-immediately behavior exactly:
  # this is the rollback lever if holds ever delay failover more than they save.
  BRIDGE_DISCONNECT_GRACE_MS = "30000"

[http_service]
  internal_port = 8787
  force_https = true
  # TEMPORARY (see #363): the in-memory Registry (WS connections + task
  # bindings) assumes a single always-on process. Until cross-instance
  # routing (Fly-Replay affinity) lands:
  #   - max=1 so the proxy can't scale out and split WS connections from
  #     the HTTP requests that need them.
  #   - auto_stop off (+ auto_start off) so the one machine is never
  #     stopped on idle — stopping it would drop every live client WS and
  #     force a reconnect storm. (min_machines_running only applies when
  #     auto_stop is on, so it's inert here and omitted.)
  # Revert to autoscaling once #363 is resolved.
  auto_stop_machines = "off"
  auto_start_machines = false
  max_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
